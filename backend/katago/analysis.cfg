# KataGo Analysis Configuration tuned for Surface CPU (Intel Core i7-7660U)

logDir = logs
reportAnalysisWinratesAs = BLACK

# Hardware / Threading limits for dual-core mobile CPU
numAnalysisThreads = 1
numSearchThreadsPerAnalysisThread = 2
numEigenThreadsPerModel = 2
nnMaxBatchSize = 4

# Visit count default
maxVisits = 100

# Memory & Cache limits (light footprint ~100MB)
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 15
nnRandomize = false
